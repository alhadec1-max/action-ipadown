name: IPA Down

env:
  PYTHONIOENCODING: utf-8

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      appleId:
        description: 'Apple ID Account'
        required: true
      appleIdPwd:
        description: 'Apple ID Password'
        required: true
      operation:
        description: 'Operation to do: lookup, historyver, download, historyver_id, download_id'
        required: true
        default: 'download_id'
      appBundleId:
        description: 'AppStore Bundle-ID (for download / lookup)'
        required: false
      appCountry:
        description: 'AppStore Country'
        required: false
        default: 'JP'
      appVerId:
        description: 'App Version Id Number (optional)'
        required: false
      appId:
        description: 'App Id Number (for download_id / historyver_id)'
        required: false

jobs:
  download_ipa:
    name: 'IPATool Operations'
    runs-on: "windows-latest"
    steps:
      - name: Masking inputs
        run: |
          SECRET_VALUE=$(cat $GITHUB_EVENT_PATH | jq -r '.inputs.appleId' )
          echo "::add-mask::$SECRET_VALUE"
          SECRET_VALUE=$(cat $GITHUB_EVENT_PATH | jq -r '.inputs.appleIdPwd' )
          echo "::add-mask::$SECRET_VALUE"
        shell: bash

      - name: Set up git repository
        uses: actions/checkout@v2

      - name: Setup ipatool-py
        run: |
          git clone -b itunes_server https://github.com/NyaMisty/ipatool-py
          pip3 install -r ipatool-py/requirements.txt
          mkdir -p ipaDown
        shell: bash

      - name: Setup iTunes Header Service
        uses: NyaMisty/actions-iTunes-header@master
        if: ${{ github.event.inputs.operation != 'lookup' }}
        with:
          apple_id: ${{ github.event.inputs.appleId }}
          apple_id_pwd: ${{ github.event.inputs.appleIdPwd }}
          ngrok_token: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Execute operation
        id: operation
        run: |
          op=${{ github.event.inputs.operation }}
          if [[ "$op" == "lookup" ]]; then
            if [[ "${{ github.event.inputs.appBundleId }}" != "" ]]; then
              python3 ipatool-py/main.py --json lookup --get-verid -b ${{ github.event.inputs.appBundleId }} -c ${{ github.event.inputs.appCountry }}
            else
              python3 ipatool-py/main.py --json lookup --get-verid -i ${{ github.event.inputs.appId }} -c ${{ github.event.inputs.appCountry }}
            fi
          elif [[ "$op" == historyver* ]]; then
            if [[ "$op" == "historyver" ]]; then
              python3 ipatool-py/main.py --json lookup -b ${{ github.event.inputs.appBundleId }} -c ${{ github.event.inputs.appCountry }} historyver -s http://127.0.0.1:9000
            elif [[ "$op" == "historyver_id" ]]; then
              python3 ipatool-py/main.py --json historyver -s http://127.0.0.1:9000 --appId ${{ github.event.inputs.appId }}
            fi
          elif [[ "$op" == download* ]]; then
            if [[ "${{ github.event.inputs.appVerId }}" == "" ]]; then
              appVerCmd=""
            else
              appVerCmd="--appVerId ${{ github.event.inputs.appVerId }}"
            fi

            if [[ "$op" == "download" ]]; then
              output=$(python3 ipatool-py/main.py --json lookup -b ${{ github.event.inputs.appBundleId }} -c ${{ github.event.inputs.appCountry }} download -o ipaDown -s http://127.0.0.1:9000 $appVerCmd)
            elif [[ "$op" == "download_id" ]]; then
              output=$(python3 ipatool-py/main.py --json download -o ipaDown -s http://127.0.0.1:9000 --appId ${{ github.event.inputs.appId }} $appVerCmd)
            fi
            echo "Got Downloading JSON result: $output"
          else
            echo "Unknown Operation: $op"
          fi
        shell: bash

      - name: "Upload package"
        uses: NyaMisty/upload-artifact-as-is@master
        with:
          path: ipaDown\*
